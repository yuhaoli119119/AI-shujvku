# ============================================================
# public-gateway — 对外只读展示站（ml.researchlife.top -> 127.0.0.1:18000）
# 安全原则：
#   1. 默认拒绝：location / 一律 404，不暴露 docs/openapi/mcp/settings/system 等
#   2. 只放行只读 GET/HEAD：所有反代 location 用 limit_except 拒绝写方法
#   3. 只放行新只读前端 /pages/readonly/ 与只读查询接口 /api/papers/
#      （列表/详情/PDF/图表图片/DFT 分页均为 GET 只读；写接口因方法限制无法到达后端）
# ============================================================
limit_req_zone $binary_remote_addr zone=public_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=public_conn:10m;

upstream literature_ai_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    # 容器内监听 8080，但外部经 https 隧道(443)访问。关闭绝对/端口重定向，
    # 让 302 返回相对路径，由浏览器按当前协议与域名拼接，避免跳到 host:8080。
    absolute_redirect off;
    port_in_redirect off;
    # 只读站点不接受任何上传，请求体压到最小
    client_max_body_size 64k;

    # 根路径直接进入只读站
    location = / {
        return 302 /pages/readonly/index.html;
    }

    # 健康检查
    location = /api/health {
        limit_req zone=public_rate burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://literature_ai_backend;
        proxy_set_header Host $host;
    }

    # 只读查询接口：列表 / 详情 / PDF / 图片资源 / DFT 分页等（全部为 GET 只读）
    location ^~ /api/papers/ {
        limit_req zone=public_rate burst=40 nodelay;
        limit_conn public_conn 12;
        # 只允许 GET/HEAD；POST/PUT/PATCH/DELETE 一律 405，写操作到不了后端
        limit_except GET HEAD { deny all; }
        proxy_pass http://literature_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 只读前端静态资源（HTML/CSS/JS）
    location ^~ /pages/readonly/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://literature_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 其余一切路径（含 /api/libraries、/api/settings、/api/system、/docs、
    # /openapi.json、/mcp、其它 /pages 子站、/shared 等）一律不暴露
    location / {
        return 404;
    }
}
