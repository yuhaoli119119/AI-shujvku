x-app-environment: &app-environment
  LITAI_DATABASE_URL: postgresql+psycopg://literature_ai:${LITAI_POSTGRES_PASSWORD:?Set LITAI_POSTGRES_PASSWORD in .env}@postgres:5432/literature_ai
  LITAI_FORCE_CONFIGURED_DATABASE: ${LITAI_FORCE_CONFIGURED_DATABASE:-true}
  LITAI_ENABLE_DEPRECATED_DB_ENDPOINTS: ${LITAI_ENABLE_DEPRECATED_DB_ENDPOINTS:-false}
  LITAI_CELERY_BROKER_URL: redis://redis:6379/0
  LITAI_CELERY_RESULT_BACKEND: redis://redis:6379/1
  LITAI_GROBID_URL: http://grobid:8070
  LITAI_MINIO_ENDPOINT: minio:9000
  LITAI_MINIO_ACCESS_KEY: ${LITAI_MINIO_ACCESS_KEY:?Set LITAI_MINIO_ACCESS_KEY in .env}
  LITAI_MINIO_SECRET_KEY: ${LITAI_MINIO_SECRET_KEY:?Set LITAI_MINIO_SECRET_KEY in .env}
  LITAI_STORAGE_ROOT: /data/storage
  LITAI_EMBEDDING_PROVIDER: ${LITAI_EMBEDDING_PROVIDER:-openai_compatible}
  LITAI_EMBEDDING_API_BASE: ${LITAI_EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
  LITAI_EMBEDDING_API_KEY: ${LITAI_EMBEDDING_API_KEY:-}
  LITAI_EMBEDDING_MODEL: ${LITAI_EMBEDDING_MODEL:-BAAI/bge-m3}
  LITAI_EMBEDDING_DIMENSION: ${LITAI_EMBEDDING_DIMENSION:-1024}
  LITAI_DOCLING_ENABLED: ${LITAI_DOCLING_ENABLED:-true}
  LITAI_DOCLING_DO_OCR: ${LITAI_DOCLING_DO_OCR:-false}
  LITAI_DOCLING_AUTO_OCR: ${LITAI_DOCLING_AUTO_OCR:-true}
  LITAI_DOCLING_FORCE_FULL_PAGE_OCR: ${LITAI_DOCLING_FORCE_FULL_PAGE_OCR:-false}
  LITAI_DOCLING_NUM_THREADS: ${LITAI_DOCLING_NUM_THREADS:-4}
  LITAI_DOCLING_DOCUMENT_TIMEOUT: ${LITAI_DOCLING_DOCUMENT_TIMEOUT:-120}
  LITAI_WRITER_BACKEND: ${LITAI_WRITER_BACKEND:-rule}
  LITAI_WRITER_MODEL: ${LITAI_WRITER_MODEL:-gpt-4.1-mini}
  LITAI_WRITER_API_BASE: ${LITAI_WRITER_API_BASE:-}
  LITAI_WRITER_API_KEY: ${LITAI_WRITER_API_KEY:-}
  LITAI_WRITER_TIMEOUT_SECONDS: ${LITAI_WRITER_TIMEOUT_SECONDS:-30}
  LITAI_WRITER_FALLBACK_BACKEND: ${LITAI_WRITER_FALLBACK_BACKEND:-rule}
  LITAI_WRITER_PROMPT_PATH: ${LITAI_WRITER_PROMPT_PATH:-prompts/paper_writer.yaml}
  LITAI_SETTINGS_ADMIN_TOKEN: ${LITAI_SETTINGS_ADMIN_TOKEN:-}
  LITAI_OWNER_API_TOKEN: ${LITAI_OWNER_API_TOKEN:?Set LITAI_OWNER_API_TOKEN in .env}
  LITAI_EXPORTS_ENABLED: ${LITAI_EXPORTS_ENABLED:-false}
  LITAI_BROWSE_ROOTS: ${LITAI_BROWSE_ROOTS:-/host/users,/data,/legacy}
  LITAI_LOCAL_INGEST_ROOTS: ${LITAI_LOCAL_INGEST_ROOTS:-/host/users}
  LITAI_SHARE_PUBLIC_BASE_URL: ${LITAI_SHARE_PUBLIC_BASE_URL:-http://localhost:8080}
  LITAI_MCP_ENABLED: ${LITAI_MCP_ENABLED:-true}
  LITAI_MCP_ALLOW_UNAUTHENTICATED: "false"
  LITAI_MCP_SERVER_NAME: ${LITAI_MCP_SERVER_NAME:-Literature AI MCP}
  LITAI_MCP_API_KEYS: ${LITAI_MCP_API_KEYS:-}
  FINDPAPERS_SEMANTIC_SCHOLAR_API_TOKEN: ${FINDPAPERS_SEMANTIC_SCHOLAR_API_TOKEN:-}
  FINDPAPERS_PUBMED_API_TOKEN: ${FINDPAPERS_PUBMED_API_TOKEN:-}
  FINDPAPERS_SCOPUS_API_TOKEN: ${FINDPAPERS_SCOPUS_API_TOKEN:-}
  FINDPAPERS_IEEE_API_TOKEN: ${FINDPAPERS_IEEE_API_TOKEN:-}
  FINDPAPERS_OPENALEX_API_TOKEN: ${FINDPAPERS_OPENALEX_API_TOKEN:-}

services:
  # PostgreSQL + pgvector is the intended production source of truth when
  # LITAI_FORCE_CONFIGURED_DATABASE=true is set for backend and worker.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: literature_ai
      POSTGRES_USER: literature_ai
      POSTGRES_PASSWORD: ${LITAI_POSTGRES_PASSWORD:?Set LITAI_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature_ai -d literature_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LITAI_MINIO_ACCESS_KEY:?Set LITAI_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${LITAI_MINIO_SECRET_KEY:?Set LITAI_MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  grobid:
    image: lfoppiano/grobid:0.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    healthcheck:
      # The upstream GROBID image has bash but no curl/wget. Opening the service
      # socket is the strongest dependency-free readiness probe available.
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8070'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers $${LITAI_UVICORN_WORKERS:-1} --no-access-log"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - ./prompts:/prompts:ro
      - ./data:/data
      - ./data/docling_cache:/home/litai/.cache/docling
      # Host user directory browsing is optional. Override LITAI_HOST_USERS_ROOT on macOS/Linux.
      # If you do not need host directory browsing, comment this line out.
      - ${LITAI_HOST_USERS_ROOT:-/c/Users}:/host/users
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s

  owner-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      LITAI_OWNER_API_TOKEN: ${LITAI_OWNER_API_TOKEN:?Set LITAI_OWNER_API_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/nginx/owner.conf.template:/etc/nginx/templates/default.conf.template:ro

  share-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LITAI_SHARE_BIND_IP:-0.0.0.0}:${LITAI_SHARE_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/share.conf:/etc/nginx/conf.d/default.conf:ro

  # 对外只读展示站（ml.researchlife.top）。只暴露只读前端 /pages/readonly/
  # 与只读 GET 查询接口 /api/papers/；写方法 405、其余路径 404。
  # 仅绑定回环地址，由 cloudflared/面板隧道对外，不直接暴露端口。
  public-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITAI_PUBLIC_PORT:-18000}:8080"
    volumes:
      - ./deploy/nginx/public.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A app.workers.celery_app.celery_app worker --loglevel=info
      -Q workflow_default
      --concurrency=${LITAI_CELERY_CONCURRENCY:-1}
      --prefetch-multiplier=1
      --max-tasks-per-child=${LITAI_CELERY_MAX_TASKS_PER_CHILD:-5}
    environment: *app-environment
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./prompts:/prompts:ro
      - ./data:/data
      - ./data/docling_cache:/home/litai/.cache/docling
      - ${LITAI_HOST_USERS_ROOT:-/c/Users}:/host/users

  worker-pdf:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A app.workers.celery_app.celery_app worker --loglevel=info
      -Q workflow_pdf_ingest
      --concurrency=${LITAI_CELERY_PDF_CONCURRENCY:-1}
      --prefetch-multiplier=1
      --max-tasks-per-child=${LITAI_CELERY_MAX_TASKS_PER_CHILD:-5}
    environment: *app-environment
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./prompts:/prompts:ro
      - ./data:/data
      - ./data/docling_cache:/home/litai/.cache/docling
      - ${LITAI_HOST_USERS_ROOT:-/c/Users}:/host/users

volumes:
  postgres_data:
  minio_data:
