<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容知识审核台 - Literature AI</title>
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/components.css">
  <link rel="stylesheet" href="../../shared/topnav.css">
  <link rel="stylesheet" href="./page.css">
  <script src="../../shared/topnav.js"></script>
  <script>ThemeManager.init();</script>
</head>
<body>
  <div id="topnav-mount"></div>
  <main class="workspace">
    <header class="page-head">
      <div>
        <p class="eyebrow">内容审核工作台</p>
        <h1>内容知识</h1>
        <p class="page-intro">逐条核对论文内容、证据与来源风险；人工决定后才会改变内容的引用或写作使用状态。</p>
      </div>
      <span class="status-pill" id="schemaStatus">内容索引</span>
    </header>

    <form id="knowledgeFilters" class="filters" novalidate>
      <label class="search-field" for="queryInput"><span>全局搜索</span><input id="queryInput" name="query" autocomplete="off" placeholder="论文号、标题、内容或证据关键词"></label>
      <label class="field" for="categorySelect"><span>类别</span><select id="categorySelect" name="category"></select></label>
      <label class="field" for="reviewSelect"><span>审核状态</span><select id="reviewSelect" name="review_status"><option value="">全部</option><option value="needs_review">待审核</option><option value="needs_human">需人工</option><option value="validated">已审核</option><option value="rejected">已拒绝</option></select></label>
      <button class="primary-btn" type="submit">检索</button>
      <button class="text-btn" id="moreFiltersToggle" type="button" aria-expanded="false" aria-controls="moreFilters">更多筛选</button>
      <section class="more-filters" id="moreFilters" hidden>
        <label class="field" for="paperInput"><span>论文号 / ID</span><input id="paperInput" name="paper_id" autocomplete="off" placeholder="如 B0078"></label>
        <label class="field" for="libraryInput"><span>文献库</span><input id="libraryInput" name="library_name" autocomplete="off"></label>
        <label class="field" for="citationSelect"><span>引用资格</span><select id="citationSelect" name="citation_status"><option value="">全部</option><option value="citable">可引用</option><option value="writing_only">仅写作</option><option value="needs_review">待审核</option><option value="blocked">阻断</option></select></label>
        <label class="check-field"><input id="candidateToggle" name="include_candidates" type="checkbox" checked>包含候选项</label>
        <label class="check-field"><input id="blockedToggle" name="include_blocked" type="checkbox">只看阻断风险</label>
      </section>
    </form>

    <section class="workbench-status" aria-live="polite">
      <span id="resultRange">准备加载内容知识…</span>
      <span id="scopeBanner"></span>
      <span id="actionMessage" class="action-message" hidden></span>
    </section>

    <section class="workbench" aria-label="内容知识审核工作台">
      <aside class="results-panel panel" aria-label="检索结果">
        <div class="panel-heading"><h2>结果</h2><span id="resultCount"></span></div>
        <div id="listRoot" class="knowledge-list"><div class="state-card">加载中…</div></div>
        <button id="loadMoreButton" class="secondary-btn" type="button" hidden>加载更多</button>
      </aside>
      <section class="detail-panel panel" aria-label="内容详情" id="detailRoot"><div class="state-card">从左侧选择一条内容以查看证据与技术详情。</div></section>
      <aside class="review-panel panel" aria-label="审核和来源风险" id="reviewRoot"><div class="state-card">选择内容后可进行人工审核。</div></aside>
    </section>

    <details class="advanced-actions">
      <summary>批量与高级操作</summary>
      <p>这些操作面向索引维护或离线审核；日常审核请使用右侧的逐卡决定。</p>
      <p id="syncScope" class="muted">同步范围：请先选择论文或文献库。</p>
      <div class="advanced-buttons">
        <button data-advanced="sync" class="secondary-btn" type="button">同步内容索引</button>
        <button data-advanced="bundle" class="secondary-btn" type="button">生成 AI 审核包</button>
        <button data-advanced="import" class="secondary-btn" type="button">导入审核回传</button>
        <button data-advanced="export" class="secondary-btn" type="button">导出写作证据计划</button>
      </div>
    </details>
  </main>
  <script type="module" src="./page.js"></script>
</body>
</html>
