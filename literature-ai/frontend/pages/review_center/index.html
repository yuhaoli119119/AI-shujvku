<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核中心 - Literature AI</title>
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/components.css">
  <link rel="stylesheet" href="../../shared/topnav.css">
  <script src="../../shared/topnav.js?v=20260606-ui3"></script>
  <script>ThemeManager.init();</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--color-text);
      background: var(--color-bg);
      font-family: var(--font-body);
      --review-panel-head-height: 0px;
    }
    .shell {
      width: min(1520px, 100%);
      margin: 0 auto;
      padding: 0 16px 8px;
    }
    .review-topline {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 16px;
      margin-bottom: 12px;
      padding: 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .stat {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
    }
    .stat-icon {
      width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 6px;
      background: var(--color-primary-bg);
      color: var(--color-primary);
    }
    .stat-icon::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 2px rgba(12, 87, 164, 0.12);
    }
    .stat-icon-docs {
      color: #0f766e;
    }
    .stat-icon-human {
      color: #0f766e;
    }
    .stat-icon-quality {
      color: #0f766e;
    }
    .stat-icon-dft {
      color: #0f766e;
    }
    .stat-icon-conflict {
      color: #0f766e;
    }
    .stat-label {
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value {
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }
    .page-actions {
      display: grid;
      grid-template-columns: 42px minmax(190px, 1.1fr) minmax(150px, 0.9fr) minmax(220px, 1.25fr);
      gap: 8px;
      flex: 0 0 720px;
    }
    .page-actions .btn {
      min-width: 0;
      height: 36px;
      padding: 0 8px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 850;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .page-actions select.btn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      text-align: center;
      text-align-last: center;
      cursor: pointer;
    }
    .page-actions .icon-btn {
      padding: 0;
      font-size: 14px;
      font-weight: 900;
    }
    .btn-tinted {
      background: var(--color-primary-bg);
      color: var(--color-primary);
      border-color: transparent;
      font-weight: 800;
    }
    .btn-tinted:hover {
      background: var(--color-primary-light);
    }
    .panel {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      padding: 0;
      margin-bottom: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: var(--nav-height);
      z-index: 32;
      background: var(--color-surface);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .filterbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filterbar select,
    .filterbar input {
      height: 30px;
      min-width: 120px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--color-text-secondary);
      padding: 0 8px;
      font: inherit;
      font-size: 12px;
    }
    .filterbar input {
      min-width: 190px;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      position: relative;
    }
    .review-table-head-shell {
      position: sticky;
      top: calc(var(--nav-height) + var(--review-panel-head-height));
      z-index: 24;
      overflow: hidden;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface-alt);
    }
    .review-table-head {
      min-width: 1080px;
      display: grid;
      grid-template-columns: 108px 70px minmax(320px, 36fr) minmax(180px, 18fr) minmax(220px, 24fr) minmax(150px, 16fr);
      transform: translateX(0);
      will-change: transform;
    }
    .review-table-head-cell {
      min-height: 35px;
      padding: 2px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      border-right: 1px solid var(--color-border);
      background: var(--color-surface-alt);
    }
    .review-table-head-cell:last-child {
      border-right: 0;
    }
    .review-table-head-cell.id-head {
      justify-content: flex-start;
      padding-left: 16px;
    }
    .review-table-head-cell.id-head .select-head {
      justify-items: start;
      min-width: 72px;
    }
    .panel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 40px;
      padding: 4px 12px;
      border-top: 1px solid var(--color-border);
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.92), rgba(255, 255, 255, 0.96));
    }
    .pagination-meta {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: var(--color-text-secondary);
      line-height: 1;
    }
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .pagination-pages {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .page-size-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .page-size-box select {
      height: 28px;
      min-width: 72px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 8px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }
    .page-indicator {
      min-width: 34px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .page-indicator.is-active {
      border-color: transparent;
      background: var(--color-primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(12, 87, 164, 0.22);
    }
    .page-indicator[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      min-width: 1080px;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }
    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: middle;
    }
    table thead {
      display: none;
    }
    th {
      color: var(--color-text-secondary);
      background: var(--color-surface-alt);
      font-weight: 900;
      white-space: nowrap;
      position: static;
    }
    .col-divider {
      border-right: 1px solid var(--color-border);
    }
    th:nth-child(1), td:nth-child(1) { width: 108px; }
    th:nth-child(2), td:nth-child(2) { width: 70px; }
    th:nth-child(3), td:nth-child(3) { width: 36%; }
    th:nth-child(4), td:nth-child(4) { width: 18%; }
    th:nth-child(5), td:nth-child(5) { width: 24%; }
    th:nth-child(6), td:nth-child(6) { width: 16%; }
    .paper-title {
      font-family: Arial, "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .select-head,
    .row-select-cell {
      display: inline-grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      justify-content: center;
      justify-items: center;
      gap: 4px;
      min-width: 44px;
    }
    .row-select-cell {
      justify-items: start;
      min-width: 86px;
    }
    .row-paper-code {
      display: inline-block;
      max-width: 64px;
      font-size: 12px;
      font-weight: 800;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .select-head input,
    .row-select-cell input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      margin: 0;
    }
    .paper-meta-line {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
      font-size: 11px;
      color: var(--color-text-secondary);
      min-width: 0;
    }
    .paper-doi-inline {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .muted {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .mono {
      font-family: var(--font-mono);
      word-break: break-all;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      max-width: 100%;
    }
    .chip.ok {
      background: var(--color-success-bg);
      color: var(--color-success);
    }
    .chip.warn {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }
    .chip.bad {
      background: var(--color-danger-bg);
      color: var(--color-danger);
    }
    .chip.mid {
      background: #fff1df;
      color: #b45309;
    }
    .chip.low {
      background: #fff8cc;
      color: #a16207;
    }
    .chip.subtle {
      background: var(--color-surface-alt);
      color: var(--color-text-tertiary, var(--color-text-secondary));
      border: 1px dashed var(--color-border);
    }
    .chip.compact {
      min-width: 0;
    }
    .chip[data-action] {
      cursor: pointer;
    }
    .status-cell,
    .audit-cell,
    .action-cell {
      min-width: 0;
    }
    .status-cluster {
      display: grid;
      gap: 5px;
    }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: flex-start;
    }
    .audit-summary {
      display: grid;
      gap: 5px;
    }
    .audit-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .audit-topline-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .audit-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      line-height: 1.35;
    }
    .audit-metrics span {
      white-space: nowrap;
    }
    .audit-metrics .active {
      color: var(--color-danger);
      font-weight: 800;
    }
    .btn.btn-chip {
      min-height: 26px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
    }
    .actions .btn-sm {
      min-height: 26px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .empty,
    .error {
      margin: 14px;
      padding: 18px;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius);
      color: var(--color-text-secondary);
      background: var(--color-surface-alt);
    }
    .error {
      border-color: var(--color-danger);
      color: var(--color-danger);
    }
    .toast {
      position: fixed;
      top: calc(var(--nav-height) + 16px);
      right: 22px;
      z-index: 140;
      display: none;
      max-width: min(420px, calc(100vw - 44px));
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: #fff;
      box-shadow: var(--shadow-elevated);
      font-size: 13px;
      line-height: 1.45;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.34);
      backdrop-filter: blur(3px);
    }
    .overlay.open {
      display: flex;
    }
    .modal-card {
      width: min(1360px, calc(100vw - 28px));
      max-height: min(88vh, 980px);
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface);
      box-shadow: var(--shadow-elevated);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--color-border);
    }
    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
    }
    .modal-subtitle {
      margin-top: 6px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .modal-close {
      flex: 0 0 auto;
      min-width: 40px;
    }
    .modal-body {
      overflow: auto;
      padding: 16px 18px 18px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--color-border);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .detail-stack {
      display: grid;
      gap: 16px;
    }
    .detail-hero {
      border: 1px solid var(--color-border);
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0.02)),
        var(--color-surface-alt);
      padding: 16px;
      display: grid;
      gap: 10px;
    }
    .detail-hero-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .detail-hero-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1.4;
    }
    .detail-hero-copy {
      font-size: 13px;
      line-height: 1.65;
      color: var(--color-text-secondary);
    }
    .detail-section-card {
      border: 1px solid var(--color-border);
      border-radius: 16px;
      background: var(--color-surface-alt);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .detail-section-head {
      display: grid;
      gap: 4px;
    }
    .detail-section-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--color-text);
    }
    .detail-section-tip {
      font-size: 12px;
      line-height: 1.55;
      color: var(--color-text-secondary);
    }
    .detail-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .detail-kpi {
      border: 1px solid var(--color-border);
      border-radius: 14px;
      background: var(--color-surface);
      padding: 12px;
      display: grid;
      gap: 4px;
    }
    .detail-kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .detail-kpi-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1.2;
    }
    .detail-kpi-note {
      font-size: 12px;
      line-height: 1.45;
      color: var(--color-text-secondary);
    }
    .detail-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .detail-block {
      display: grid;
      gap: 4px;
    }
    .detail-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--color-text-secondary);
      text-transform: uppercase;
    }
    .detail-value {
      font-size: 12px;
      line-height: 1.5;
      color: var(--color-text);
      word-break: break-word;
    }
    .detail-list {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 3px 12px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }
    .detail-list li + li::before {
      content: "·";
      margin-right: 12px;
      opacity: 0.5;
    }
    .conflict-stack {
      display: grid;
      gap: 12px;
    }
    .conflict-workbench {
      display: grid;
      gap: 14px;
    }
    .conflict-status-panel {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: linear-gradient(135deg, #f8fafc 0%, #eef7f6 100%);
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .conflict-status-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .conflict-status-copy {
      min-width: 0;
    }
    .conflict-status-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .conflict-status-title {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
      color: var(--color-text);
    }
    .conflict-status-note {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .conflict-summary-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .conflict-workbench-grid {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .conflict-workbench-grid.is-list-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }
    .conflict-workbench-grid.is-list-collapsed .conflict-list-panel {
      display: none;
    }
    .conflict-list-panel,
    .conflict-detail-panel {
      min-width: 0;
    }
    .conflict-list-panel {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
      overflow: hidden;
      position: sticky;
      top: 0;
    }
    .conflict-panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface-alt);
    }
    .conflict-panel-copy {
      min-width: 0;
    }
    .conflict-panel-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--color-text);
    }
    .conflict-panel-note {
      margin-top: 3px;
      color: var(--color-text-secondary);
      font-size: 11px;
      line-height: 1.45;
    }
    .conflict-list {
      max-height: min(58vh, 620px);
      overflow: auto;
      display: grid;
      gap: 0;
    }
    .conflict-list-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--color-border);
      background: transparent;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 8px;
      color: var(--color-text);
    }
    .conflict-list-item:hover {
      background: rgba(13, 116, 111, 0.06);
    }
    .conflict-list-item.is-active {
      background: #eef7f6;
      box-shadow: inset 3px 0 0 var(--color-primary);
    }
    .conflict-list-title {
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      word-break: break-word;
    }
    .conflict-list-meta {
      color: var(--color-text-secondary);
      font-size: 11px;
      line-height: 1.45;
      word-break: break-word;
    }
    .conflict-list-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .conflict-detail-panel {
      display: grid;
      gap: 12px;
    }
    .conflict-detail-empty {
      border: 1px dashed var(--color-border);
      border-radius: 8px;
      padding: 18px;
      color: var(--color-text-secondary);
      background: var(--color-surface-alt);
      font-size: 13px;
      line-height: 1.5;
    }
    .conflict-card {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface-alt);
      overflow: hidden;
    }
    .conflict-card.is-high {
      border-color: rgba(220, 38, 38, 0.25);
      box-shadow: inset 0 0 0 1px rgba(220, 38, 38, 0.08);
    }
    .conflict-card.is-medium {
      border-color: rgba(217, 119, 6, 0.22);
    }
    .conflict-card.is-low {
      border-color: rgba(202, 138, 4, 0.22);
    }
    .conflict-card summary {
      list-style: none;
      cursor: pointer;
    }
    .conflict-card summary::-webkit-details-marker {
      display: none;
    }
    .conflict-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px 10px;
    }
    .conflict-card-left {
      min-width: 0;
      display: grid;
      gap: 4px;
    }
    .conflict-card-right {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-items: flex-start;
      flex: 0 0 auto;
    }
    .conflict-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--color-text);
    }
    .conflict-meta {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .conflict-body {
      display: grid;
      gap: 14px;
      padding: 14px;
    }
    .conflict-object-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
    }
    .conflict-object-item {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .conflict-object-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--color-text-secondary);
      text-transform: uppercase;
    }
    .conflict-object-value {
      font-size: 12px;
      line-height: 1.5;
      color: var(--color-text);
      word-break: break-word;
    }
    .conflict-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .compare-table-wrap {
      overflow-x: clip;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
    }
    .compare-table {
      width: 100%;
      min-width: 0;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 11px;
    }
    .compare-table th,
    .compare-table td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: top;
      text-align: left;
      line-height: 1.4;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .compare-table th {
      position: static;
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      font-weight: 900;
    }
    .compare-table tr:last-child td {
      border-bottom: 0;
    }
    .compare-col-source { width: 24%; }
    .compare-col-decision { width: 10%; }
    .compare-col-value { width: 14%; }
    .compare-col-reason { width: 36%; }
    .compare-col-action { width: 16%; }
    .opinion-source {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.45;
      word-break: break-word;
    }
    .opinion-submeta {
      margin-top: 4px;
      color: var(--color-text-secondary);
      font-size: 10px;
      line-height: 1.4;
      word-break: break-word;
    }
    .reason-block {
      display: grid;
      gap: 6px;
    }
    .reason-text {
      color: var(--color-text);
      line-height: 1.5;
      word-break: break-word;
    }
    .reason-text.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .expand-link {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--color-primary);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }
    .compare-extra[hidden] {
      display: none !important;
    }
    .conflict-card-actions {
      display: flex;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }
    .opinion-action {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .opinion-action-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .opinion-action-stack .btn {
      width: 100%;
      white-space: normal;
      line-height: 1.35;
    }
    .conflict-footer-note {
      margin-top: 14px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .conflict-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .conflict-main,
    .evidence-preview-shell {
      min-width: 0;
    }
    .evidence-preview-shell {
      min-width: 0;
    }
    .evidence-preview-card {
      border: 1px solid #d7e2ef;
      border-radius: 8px;
      background: #fbfdff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: static;
    }
    .evidence-preview-card.is-placeholder {
      min-height: 120px;
      justify-content: center;
    }
    .evidence-preview-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--color-text);
    }
    .evidence-preview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .evidence-preview-meta .detail-block {
      flex: 1 1 150px;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #d7e2ef;
      border-radius: 8px;
      background: #fff;
    }
    .evidence-preview-meta .detail-block.is-wide {
      flex-basis: 100%;
    }
    .evidence-preview-section {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid #d7e2ef;
      border-radius: 8px;
      background: #fff;
    }
    .evidence-excerpt {
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .compare-table tr.is-active td {
      background: rgba(12, 87, 164, 0.08);
    }
    .btn.btn-weak {
      min-height: 26px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .btn.btn-weak[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .web-ai-return-modal {
      width: min(980px, calc(100vw - 28px));
    }
    .web-ai-return-layout {
      display: grid;
      gap: 14px;
    }
    .web-ai-return-label {
      display: grid;
      gap: 7px;
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 800;
    }
    .web-ai-return-textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface-alt);
      color: var(--color-text);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
    }
    .web-ai-return-textarea:focus {
      outline: 2px solid var(--color-primary-bg);
      border-color: var(--color-primary);
    }
    .web-ai-return-textarea.is-dragging {
      outline: 2px solid var(--color-primary);
      border-color: var(--color-primary);
      background: var(--color-primary-bg);
    }
    .web-ai-return-file-hint {
      color: var(--color-text-tertiary, var(--color-text-secondary));
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
    }
    .web-ai-return-file-hint strong {
      color: var(--color-primary);
      font-weight: 800;
    }
    .web-ai-validation-box {
      min-height: 76px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface-alt);
      padding: 12px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }
    .web-ai-validation-box.is-success {
      border-color: var(--color-success);
      background: var(--color-success-bg);
      color: var(--color-text);
    }
    .web-ai-validation-box.is-error {
      border-color: var(--color-danger);
      background: var(--color-danger-bg);
      color: var(--color-danger);
    }
    .web-ai-validation-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .web-ai-validation-item {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      padding: 8px 10px;
    }
    .web-ai-validation-item strong {
      display: block;
      margin-bottom: 3px;
      color: var(--color-text-secondary);
      font-size: 11px;
    }
    .web-ai-return-footer {
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .web-ai-return-footer-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 820px) {
      .shell {
        padding-left: 12px;
        padding-right: 12px;
      }
      .review-topline,
      .panel-head {
        display: block;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .page-actions {
        grid-template-columns: repeat(2, 1fr);
        margin-top: 12px;
      }
      .page-actions .btn {
        height: 34px;
      }
      .filterbar {
        margin-top: 12px;
      }
      .filterbar select,
      .filterbar input {
        width: 100%;
      }
      .panel-foot {
        align-items: stretch;
      }
      .review-table-head-shell {
        top: calc(var(--nav-height) + var(--review-panel-head-height));
      }
      .pagination-bar {
        width: 100%;
        justify-content: flex-start;
        margin-left: 0;
      }
      table {
        min-width: 980px;
      }
      .overlay {
        padding: 12px;
      }
      .modal-card {
        width: min(100vw - 16px, 1360px);
        max-height: calc(100vh - 24px);
      }
      .conflict-card-head {
        display: grid;
      }
      .conflict-card-right {
        justify-content: flex-start;
      }
      .conflict-status-head,
      .conflict-panel-head {
        display: grid;
      }
      .conflict-object-grid {
        grid-template-columns: 1fr 1fr;
      }
      .evidence-preview-card {
        position: static;
      }
      .evidence-preview-meta {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div id="topnav-mount"></div>
  <main class="shell">
    <div class="review-topline">
      <section class="stats" id="stats"></section>
      <div class="page-actions">
        <button class="btn btn-ghost icon-btn" type="button" onclick="loadReviewCenter()" title="刷新审核中心" aria-label="刷新审核中心">↻</button>
        <select class="btn btn-ghost" id="webAiWorkflowSelect" title="网页 AI 图表/DFT 离线审核流程" onchange="handleWebAiWorkflowSelect()">
          <option value="">网页 AI 流程</option>
          <option value="export_evidence">1 导出图表证据包</option>
          <option value="copy_evidence_prompt">复制图表提示词</option>
          <option value="return_evidence">2 回传图表 JSON</option>
          <option value="copy_evidence_local_ai">复制本地 AI 图表复核指令</option>
          <option value="export_dft">3 导出 DFT 终审包</option>
          <option value="copy_dft_prompt">复制 DFT 提示词</option>
          <option value="return_dft">4 回传 DFT JSON</option>
        </select>
        <select class="btn btn-tinted" id="materialActionSelect" title="材料操作" onchange="handleMaterialActionSelect()">
          <option value="">材料操作</option>
          <option value="prepare_filtered">AI 重建</option>
          <option value="prepare_suspected_missing">漏提材料</option>
          <option value="prepare_library">重建材料</option>
        </select>
        <select class="btn btn-ghost" id="promptCopySelect" title="复制单篇 AI 审核提示词" onchange="handlePromptCopySelect()">
          <option value="">复制单篇任务提示词</option>
          <option value="main_figure">主文图片审核提示词</option>
          <option value="support_figure">支撑文献图片审核提示词</option>
          <option value="table">表格审核提示词</option>
          <option value="dft">DFT 数据审核与入库提示词</option>
        </select>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="muted mono" id="queueMeta" style="font-size: 12px; font-weight: 700; letter-spacing: 0.4px;">正在读取当前库...</div>
        <div class="filterbar">
          <select id="libraryFilter" onchange="setReviewLibraryFilter()">
            <option value="">全部文献库</option>
          </select>
          <select id="statusFilter" onchange="handleFilterChange()">
            <option value="">全部流程状态</option>
          </select>
          <select id="workflowStatusFilter" onchange="handleFilterChange()">
            <option value="">具体流程状态</option>
          </select>
          <select id="qualityFilter" onchange="handleFilterChange()">
            <option value="">全部 PDF 质量</option>
            <option value="A_text_readable">A 文本可读</option>
            <option value="B_text_partial">B 部分可读</option>
            <option value="C_scan_clear">C 扫描清晰</option>
            <option value="D_scan_unclear">D 扫描不清</option>
            <option value="Broken">Broken</option>
          </select>
          <select id="sortFilter" onchange="handleSortChange()">
            <option value="recent">最近入库优先</option>
            <option value="year_desc">年份新到旧</option>
            <option value="paper_code_asc">短号顺序</option>
            <option value="conflicts_desc">冲突优先（DFT/图表/内容）</option>
            <option value="suspected_missing_desc">疑似漏提优先</option>
          </select>
          <input id="searchBox" type="search" placeholder="搜索标题 / DOI / 期刊 / 年份 / 短 ID" oninput="handleSearchInput()">
        </div>
      </div>
      <div class="review-table-head-shell">
        <div class="review-table-head" id="reviewTableHead">
          <div class="review-table-head-cell col-divider id-head"><span class="select-head"><input id="selectAllVisible" type="checkbox" aria-label="全选或全不选当前页" onchange="toggleVisibleRowsSelection(this.checked)"><span>ID</span></span></div>
          <div class="review-table-head-cell col-divider">年份</div>
          <div class="review-table-head-cell col-divider">文献标题</div>
          <div class="review-table-head-cell col-divider">文献状态</div>
          <div class="review-table-head-cell col-divider">DFT 审计</div>
          <div class="review-table-head-cell">操作</div>
        </div>
      </div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th class="col-divider" style="text-align:center;">ID</th>
              <th class="col-divider" style="text-align:center;">年份</th>
              <th class="col-divider" style="text-align:center;">文献标题</th>
              <th class="col-divider" style="text-align:center;">文献状态</th>
              <th class="col-divider" style="text-align:center;">DFT 审计</th>
              <th style="text-align:center;">操作</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6"><div class="empty">正在加载...</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel-foot">
        <div class="pagination-meta muted" id="paginationMeta">正在准备分页...</div>
        <div class="pagination-bar" id="paginationBar"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="infoOverlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
      <div class="modal-head">
        <div>
          <h3 class="modal-title" id="infoModalTitle">详情</h3>
          <div class="modal-subtitle" id="infoModalSubtitle"></div>
        </div>
        <button class="btn btn-ghost btn-sm modal-close" type="button" onclick="closeInfoOverlay()">关闭</button>
      </div>
      <div class="modal-body" id="infoModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" type="button" onclick="closeInfoOverlay()">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="webAiReturnOverlay" aria-hidden="true">
    <div class="modal-card web-ai-return-modal" role="dialog" aria-modal="true" aria-labelledby="webAiReturnTitle">
      <div class="modal-head">
        <div>
          <h3 class="modal-title" id="webAiReturnTitle">回传网页 AI 结果</h3>
          <div class="modal-subtitle" id="webAiReturnSubtitle">请先选择一篇主文献。</div>
        </div>
        <button class="btn btn-ghost btn-sm modal-close" type="button" onclick="closeWebAiReturnDialog()">关闭</button>
      </div>
      <div class="modal-body">
        <div class="web-ai-return-layout">
          <label class="web-ai-return-label" for="webAiReturnJson">
            粘贴网页 AI 返回 JSON，或直接拖入 JSON 文件
            <textarea class="web-ai-return-textarea" id="webAiReturnJson" spellcheck="false" placeholder="粘贴严格符合 return_schema.json 的 JSON，或把 .json 文件直接拖到这里；内容只保留在当前页面内存中。" oninput="handleWebAiReturnInput()" ondragenter="handleWebAiFileDrag(event)" ondragover="handleWebAiFileDrag(event)" ondragleave="handleWebAiFileDragLeave(event)" ondrop="handleWebAiFileDrop(event)"></textarea>
            <span class="web-ai-return-file-hint"><strong>支持桌面拖放：</strong>文件只在当前页面内存中读取，不会上传保存；读取后仍需点击“校验结果”。</span>
          </label>
          <div class="web-ai-validation-box" id="webAiValidationResult">尚未校验。校验成功也不会自动入库。</div>
        </div>
      </div>
      <div class="modal-footer web-ai-return-footer">
        <div class="web-ai-return-footer-group">
          <button class="btn btn-ghost btn-sm" type="button" onclick="clearWebAiReturnInput()">清空</button>
          <button class="btn btn-tinted btn-sm" id="webAiValidateBtn" type="button" onclick="validateWebAiReturnJson()">校验结果</button>
        </div>
        <div class="web-ai-return-footer-group">
          <button class="btn btn-tinted btn-sm" id="webAiApplyEvidenceBtn" type="button" onclick="applyWebAiEvidenceResult()" disabled style="display:none;">应用图表结果</button>
          <button class="btn btn-tinted btn-sm" id="webAiCopyInstructionBtn" type="button" onclick="copyLocalAiImportInstruction()" disabled>复制本地 AI 处理指令</button>
          <button class="btn btn-ghost btn-sm" type="button" onclick="closeWebAiReturnDialog()">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      rows: [],
      metadata: {},
      libraries: [],
      pagination: {
        page: 1,
        pageSize: 25
      }
    };
    const CURRENT_LIBRARY_STORAGE_KEY = "litai_current_library";
    const REVIEW_CENTER_FILTER_SESSION_KEY = "litai:review-center:filters:v1";
    const REVIEW_CENTER_FETCH_LIMITS = [5000, 500];
    const selectedPaperIds = new Set();
    const webAiReturnState = {
      mode: "dft",
      paperId: "",
      paperCode: "",
      validatedRawText: "",
      validationResponse: null
    };
    const PROMPT_COPY_ACTIONS = {
      main_figure: {
        kind: "figure",
        sourceKind: "main_figure",
        label: "主文图片审核提示词",
        targetScope: "main",
        scopeNote: [
          "目标：只审核当前唯一主文献的图片和主文 PDF 证据。",
          "- 不处理支撑文献/SI 图片、表格或其他模块。",
          "- 只有图片或图注明确给出可结构化的 DFT 结果时，才创建未验证 DFT 候选并保留图片证据。"
        ].join("\n")
      },
      support_figure: {
        kind: "figure",
        sourceKind: "support_figure",
        label: "支撑文献图片审核提示词",
        targetScope: "support",
        scopeNote: [
          "目标：只审核当前唯一支撑文献/SI 的图片和 SI PDF 证据。",
          "- 不处理主文图片、表格或其他模块。",
          "- 只有图片或图注明确给出可结构化的 DFT 结果时，才创建未验证 DFT 候选。",
          "- DFT 候选按 codex context 的 writeback_paper_id 写回主文，并保留 SI paper_id、figure_id、页码和 source_document_type。"
        ].join("\n")
      },
      table: {
        kind: "table",
        sourceKind: "table",
        label: "表格审核提示词",
        targetScope: "main",
        scopeNote: [
          "目标：只审核当前唯一主文献及其已关联 SI 的表格。",
          "- SI 表格修改必须使用该表真实 paper_id。",
          "- 只处理表格对象；其他问题交给对应专项任务。"
        ].join("\n")
      },
      dft: {
        kind: "dft",
        sourceKind: "dft",

    function apiErrorMessageFromPayload(data, status) {
      const detail = data && data.detail;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail)) {
        return detail.map(function (item) {
          if (item && typeof item === "object") {
            if (item.msg) return item.msg;
            if (item.message) return item.message;
            try {
              return JSON.stringify(item);
            } catch (_) {
              return String(item);
            }
          }
          return String(item);
        }).join("; ");
      }
        if (detail && typeof detail === "object") {
        if (detail.code === "figure_table_review_not_completed") {
          const gate = detail.figure_table_review || {};
          const stage = gate.stage_status || "unknown";
          const ragStatus = gate.rag_quality_status || (gate.rag_quality && gate.rag_quality.figures && gate.rag_quality.figures.status) || "";
          const blocked = gate.rag_quality && gate.rag_quality.figures ? Number(gate.rag_quality.figures.blocked || 0) : 0;
          if (ragStatus === "blocked" || blocked > 0) {
            return "图表证据阶段不能进入 DFT：仍有 " + blocked + " 个图表 RAG 不合格。请先在图表页补齐图类型、图摘要、关键元素或修复裁图，再重新回传图表 JSON。";
          }
          return "图表证据阶段尚未完成或已过期（stage_status=" + stage + "）。请先执行“1 导出图表证据包”并“2 回传图表 JSON”；完成后再导出 DFT 终审包。";
        }
        if (detail.message) return detail.message;
        if (detail.code) return detail.code;
        try {
          return JSON.stringify(detail);
        } catch (_) {
          return String(detail);
        }
      }
      return data && data.message ? String(data.message) : ("HTTP " + status);
    }

    function contentDispositionFilename(headerValue, fallback) {
      const value = String(headerValue || "");
      const utf8Match = value.match(/filename\*=UTF-8''([^;]+)/i);
      if (utf8Match) {
        try {
          return decodeURIComponent(utf8Match[1]);
        } catch (_) {
          return utf8Match[1];
        }
      }
      const plainMatch = value.match(/filename="?([^";]+)"?/i);
      return plainMatch ? plainMatch[1] : fallback;
    }

    async function downloadWebAiBundle(mode) {
      const normalizedMode = mode === "evidence" ? "evidence" : "dft";
      const target = selectedWebAiSingleMainPaper();
      if (!target) return;
      const paperId = String(target.paper_id || "");
      const paperCode = String(target.paper_code || paperId.slice(0, 8) || "paper");
      const endpoint = normalizedMode === "evidence"
        ? "/api/papers/" + encodeURIComponent(paperId) + "/evidence-review-bundle?include_pdf_files=true&include_figure_files=true"
        : "/api/papers/" + encodeURIComponent(paperId) + "/dft-review-bundle?include_figure_files=true";
      const selector = document.getElementById("webAiWorkflowSelect");
      const previousTitle = selector ? selector.title : "";
      if (selector) {
        selector.disabled = true;
        selector.title = "正在导出" + webAiModeLabel(normalizedMode) + "包...";
      }
      try {
        showToast("正在导出" + webAiModeLabel(normalizedMode) + "包...");
        const response = await fetch(endpoint, { method: "POST" });
        if (!response.ok) {
          let message = "HTTP " + response.status;
          try {
            const data = await response.json();
            message = apiErrorMessageFromPayload(data, response.status);
          } catch (_) {}
          throw new Error(message);
        }
        const blob = await response.blob();
        const fallback = paperCode + (normalizedMode === "evidence" ? "_figure_table_evidence_review_bundle.zip" : "_dft_review_bundle.zip");
        const filename = contentDispositionFilename(response.headers.get("Content-Disposition"), fallback);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast(webAiModeLabel(normalizedMode) + "包已开始下载：" + filename);
      } catch (error) {
        console.error(error);
        showToast("导出失败：" + error.message);
      } finally {
        if (selector) {
          selector.disabled = false;
          selector.title = previousTitle || "网页 AI 图表/DFT 离线审核流程";
        }
      }
    }

    function inferReactionProfileFromText(text) {
      const value = String(text || "").toLowerCase();
      if (!value) return "UNKNOWN";
      if (
        /\b(li[-\s]?s|lithium[-\s]?sulfur|srr)\b/.test(value) ||
        value.includes("锂硫") ||
        value.includes("多硫化") ||
        value.includes("硫还原") ||
        value.includes("shuttle effect")
      ) return "SRR_LiS";
      if (/\b(her|hydrogen evolution)\b/.test(value)) return "HER";
      if (/\b(oer|oxygen evolution)\b/.test(value)) return "OER";
      if (/\b(orr|oxygen reduction)\b/.test(value)) return "ORR";
      if (/\b(co2rr|co2 reduction|carbon dioxide reduction)\b/.test(value)) return "CO2RR";
      return "UNKNOWN";
    }

    function inferPromptTargetReaction(kind) {
      if (kind !== "dft") return "UNKNOWN";
      const rows = promptTargetRows();
      return inferReactionProfileFromText(rows.map(function (row) {
        return [
          row && row.library_name,
          row && row.paper_code,
          row && row.title,
          row && row.abstract,
          row && row.dft_completeness_label,
          row && row.dft_completeness_status
        ].filter(Boolean).join(" ");
      }).join(" "));

    function inferProjectLibraryContext(contract) {
      const contexts = contract && contract.project_library_contexts && typeof contract.project_library_contexts === "object"

      const libraryNames = new Set(promptTargetRows().map(function (row) {

      return Object.keys(contexts).find(function (key) {
        const context = contexts[key] || {};
        return libraryNames.has(String(context.default_library_name || "").trim());
      }) || null;
    }

      }
      const row = rows[0];
      const isSupport = isSupportingInformationRow(row);
      if (actionConfig.targetScope === "support" && !isSupport) {
        throw new Error(actionConfig.label + "只能选择支撑文献/SI 行作为任务目标。");
      }
      if (actionConfig.targetScope === "main" && isSupport) {
        throw new Error(actionConfig.label + "只能选择主文献作为任务目标。");
      }
      return row;
    }

    function togglePaperSelection(paperId, checked) {
      if (!paperId) return;
      if (checked) {
        selectedPaperIds.add(String(paperId));
      } else {
        selectedPaperIds.delete(String(paperId));
      }
      renderRows();
    }

    function selectVisibleRows() {
      currentVisibleRows().forEach(function (row) {
        if (row && row.paper_id) selectedPaperIds.add(String(row.paper_id));
      });
      renderRows();
      showToast("已选择当前页文献：" + selectedPaperIds.size + " 篇");
    }

    function toggleVisibleRowsSelection(checked) {
      currentVisibleRows().forEach(function (row) {
        if (!row || !row.paper_id) return;
        if (checked) selectedPaperIds.add(String(row.paper_id));
        else selectedPaperIds.delete(String(row.paper_id));
      });
      renderRows();
    }

    function syncSelectAllVisible(rows) {
      const checkbox = document.getElementById("selectAllVisible");
      if (!checkbox) return;
      const visibleIds = (rows || []).map(function (row) { return String(row.paper_id || ""); }).filter(Boolean);
      const selectedVisible = visibleIds.filter(function (paperId) { return selectedPaperIds.has(paperId); }).length;
      checkbox.checked = visibleIds.length > 0 && selectedVisible === visibleIds.length;
      checkbox.indeterminate = selectedVisible > 0 && selectedVisible < visibleIds.length;
    }

    function clearSelectedRows() {
      selectedPaperIds.clear();
      renderRows();
      showToast("已清空文献选择");
    }

    function handleFilterChange() {
      state.pagination.page = 1;
      saveReviewCenterFilterState();
      renderRows();
    }

    function handleSortChange() {
      state.pagination.page = 1;
      saveReviewCenterFilterState();
      renderRows();
    }

    function handleSearchInput() {
      state.pagination.page = 1;
      saveReviewCenterFilterState();
      renderRows();
    }

    function totalPagesForCount(count) {
      const pageSize = Math.max(1, Number(state.pagination.pageSize || 25));
      return Math.max(1, Math.ceil(Math.max(0, Number(count || 0)) / pageSize));
    }

    function ensureValidPage(totalCount) {
      const totalPages = totalPagesForCount(totalCount);
      if (state.pagination.page > totalPages) state.pagination.page = totalPages;
      if (state.pagination.page < 1) state.pagination.page = 1;
      return totalPages;
    }

    function currentVisibleRows() {
      const rows = sortedRows(filteredRows());
      const pageSize = Math.max(1, Number(state.pagination.pageSize || 25));
      ensureValidPage(rows.length);
      const start = (state.pagination.page - 1) * pageSize;
      return rows.slice(start, start + pageSize);
    }

    function goToPage(page) {
      state.pagination.page = Number(page || 1);
      saveReviewCenterFilterState();
      renderRows();
    }

    function changePage(delta) {
      goToPage(Number(state.pagination.page || 1) + Number(delta || 0));
    }

    function setPageSize() {
      const select = document.getElementById("pageSizeSelect");
      const nextSize = Number(select && select.value ? select.value : state.pagination.pageSize);
      state.pagination.pageSize = Number.isFinite(nextSize) && nextSize > 0 ? nextSize : 25;
      state.pagination.page = 1;
      saveReviewCenterFilterState();
      renderRows();
    }

    function renderPagination(totalRows, visibleRows) {
      const totalPages = ensureValidPage(totalRows);
      const currentPage = state.pagination.page;
      const pageSize = Math.max(1, Number(state.pagination.pageSize || 25));
      const start = totalRows ? ((currentPage - 1) * pageSize + 1) : 0;
      const end = totalRows ? Math.min(totalRows, start + visibleRows.length - 1) : 0;
      const loadedCount = Number(state.rows.length || 0);
      const knownTotal = Number(state.metadata.total || loadedCount || 0);
      const hasTruncation = knownTotal > loadedCount;
      const metaParts = [];
      metaParts.push(totalRows ? ("当前页 " + start + "-" + end + " / " + totalRows + " 篇") : "当前页 0 / 0 篇");
      metaParts.push("第 " + currentPage + " / " + totalPages + " 页");
      if (hasTruncation) {
        metaParts.push("已加载 " + loadedCount + " / 总 " + knownTotal + " 篇");
      } else {
        metaParts.push("总计 " + knownTotal + " 篇");
      }
      document.getElementById("paginationMeta").textContent = metaParts.join(" | ");

      const pages = [];
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, currentPage + 2);
      for (let page = startPage; page <= endPage; page += 1) {
        pages.push(
          '<button class="page-indicator' + (page === currentPage ? ' is-active' : '') + '" type="button" onclick="goToPage(' + page + ')"' +
          (page === currentPage ? ' aria-current="page"' : '') +
          '>' + esc(page) + '</button>'
        );
      }
      document.getElementById("paginationBar").innerHTML =
        '<span class="page-size-box">每页' +
          '<select id="pageSizeSelect" onchange="setPageSize()">' +
            '<option value="25"' + (pageSize === 25 ? ' selected' : '') + '>25 篇</option>' +
            '<option value="50"' + (pageSize === 50 ? ' selected' : '') + '>50 篇</option>' +
            '<option value="100"' + (pageSize === 100 ? ' selected' : '') + '>100 篇</option>' +
          '</select>' +
        '</span>' +
        '<button class="btn btn-ghost btn-sm" type="button" onclick="goToPage(1)"' + (currentPage <= 1 ? ' disabled' : '') + '>首页</button>' +
        '<button class="btn btn-ghost btn-sm" type="button" onclick="changePage(-1)"' + (currentPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<span class="pagination-pages">' + pages.join("") + '</span>' +
        '<button class="btn btn-ghost btn-sm" type="button" onclick="changePage(1)"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页</button>' +
        '<button class="btn btn-ghost btn-sm" type="button" onclick="goToPage(' + totalPages + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>末页</button>';
    }

g_cards and mechanism_claims checked against source PDF; parser-only content remains blocked until reviewed\", \"field_name\":\"sections\", \"page\":2, \"quoted_text\":\"Results and discussion...\", \"section_title\":\"source_pdf=<source_assets.pdf_path 文件名>\"}\n  ],\n  \"correction_proposals\": [\n    {\"field_name\":\"abstract\", \"target_path\":\"abstract\", \"operation\":\"replace\", \"proposed_value\":\"Reviewed abstract text...\", \"reason\":\"detail page abstract was missing or inaccurate\", \"evidence_payload\":{\"page\":1,\"quoted_text\":\"Abstract ...\",\"source_pdf\":\"<source_assets.pdf_path 文件名>\"}},\n    {\"field_name\":\"sections\", \"target_path\":\"sections:new:create\", \"operation\":\"create\", \"proposed_value\":{\"section_title\":\"Results and discussion\", \"section_type\":\"results\", \"text\":\"Reviewed section text...\", \"page_start\":4, \"page_end\":7}, \"reason\":\"PDF contains a logical results section missing from parser output\", \"evidence_payload\":{\"page\":4,\"quoted_text\":\"Results and discussion...\",\"source_pdf\":\"<source_assets.pdf_path 文件名>\"}},\n    {\"field_name\":\"writing_cards\", \"target_path\":\"writing_cards:new:create\", \"operation\":\"create\", \"proposed_value\":{\"paper_type\":\"A_dft\", \"research_gap\":\"Reviewed research gap...\", \"proposed_solution\":\"Reviewed proposed solution...\", \"core_hypothesis\":\"Reviewed core hypothesis...\", \"evidence_chain\":[{\"text\":\"Quoted evidence from source PDF\", \"page\":5, \"source\":\"Results\", \"reviewer_status\":\"verified\", \"target_resolution_status\":\"active\", \"locator_status\":\"exact_page\"}], \"section_strategy\":{\"introduction\":\"Use reviewed gap and solution\", \"discussion\":\"Use reviewed mechanism and performance evidence\"}, \"figure_logic\":[{\"fig_id\":\"Figure 2\", \"purpose\":\"supports reviewed mechanism claim\", \"supports_claim\":\"Reviewed claim\"}], \"abstract_logic\":\"Reviewed abstract logic\", \"introduction_logic\":\"Reviewed introduction logic\", \"discussion_logic\":\"Reviewed discussion logic\"}, \"reason\":\"writing card was created only after PDF evidence review\", \"evidence_payload\":{\"page\":5,\"quoted_text\":\"Quoted evidence from source PDF\",\"source_pdf\":\"<source_assets.pdf_path 文件名>\"}},\n    {\"field_name\":\"mechanism_claims\", \"target_path\":\"mechanism_claims:new:create\", \"operation\":\"create\", \"proposed_value\":{\"claim_type\":\"lips_conversion\", \"claim_text\":\"Reviewed mechanism claim text...\", \"key_species\":[\"Li2S4\",\"Li2S\"], \"mechanism_direction\":\"promotes_conversion\", \"evidence_types\":[\"main_text\"], \"evidence_text\":\"Quoted mechanism evidence from source PDF\"}, \"reason\":\"parser missed a mechanism claim supported by the source PDF\", \"evidence_payload\":{\"page\":6,\"quoted_text\":\"Quoted mechanism evidence from source PDF\",\"source_pdf\":\"<source_assets.pdf_path 文件名>\"}}\n  ]\n}";

    async function copyIdePrompt(actionKey) {
      try {
        const actionConfig = PROMPT_COPY_ACTIONS[actionKey];
        if (!actionConfig) {
          throw new Error("未知提示词入口：" + actionKey);
        }
        validatePromptCopyTarget(actionConfig);
        await copyTextToClipboard(await buildIdePromptForCopy(actionConfig));
        showToast("已复制 " + actionConfig.label);
      } catch (error) {
        showToast("复制失败：" + error.message);
      }

    async function buildIdePromptForCopy(actionConfig) {
      try {
        const kind = actionConfig.kind;
        const guide = await fetchJSON("/api/system/agent-guide");
        const contract = guide && guide.prompt_contract ? guide.prompt_contract : {};
        const templates = contract.templates && typeof contract.templates === "object" ? contract.templates : {};
        const compositeTemplates = contract.composite_templates && typeof contract.composite_templates === "object" ? contract.composite_templates : {};
        const reactionProfileTemplates = contract.reaction_profile_templates && typeof contract.reaction_profile_templates === "object"
          ? contract.reaction_profile_templates
          : {};
        const projectLibraryTemplates = contract.project_library_prompt_templates && typeof contract.project_library_prompt_templates === "object"
          ? contract.project_library_prompt_templates
          : {};
        const targetReaction = inferPromptTargetReaction(kind);
        const projectLibraryContext = inferProjectLibraryContext(contract);
        const profileTemplates = reactionProfileTemplates[targetReaction] && typeof reactionProfileTemplates[targetReaction] === "object"
          ? reactionProfileTemplates[targetReaction]
          : {};
        const template = profileTemplates[kind] || templates[kind] || compositeTemplates[kind];
        if (!template) throw new Error("prompt contract does not include kind=" + kind);
        const projectTemplates = projectLibraryContext && projectLibraryTemplates[projectLibraryContext] && typeof projectLibraryTemplates[projectLibraryContext] === "object"
          ? projectLibraryTemplates[projectLibraryContext]
          : {};
        const projectFragment = projectTemplates[kind] || "";

        const now = new Date();
        const pad = function (value) { return String(value).padStart(2, "0"); };
        const runTag = [
          now.getFullYear(),
          pad(now.getMonth() + 1),
          pad(now.getDate()),
          "_",
          pad(now.getHours()),
          pad(now.getMinutes()),
          pad(now.getSeconds())
        ].join("");
        const sourceLabel = "<agent_name>_" + (actionConfig.sourceKind || kind) + "_" + runTag;
        const targetToken = contract.target_list_token || "{{TARGET_LIST}}";
        const sourceToken = contract.source_label_token || "{{SOURCE_LABEL}}";
        const reactionToken = contract.target_reaction_token || "{{TARGET_REACTION}}";
        const targetList = currentPromptTargets();
        let rendered = String(template)
          .split(targetToken).join(targetList)
          .split(sourceToken).join(sourceLabel)
          .split(reactionToken).join(targetReaction);
        if (projectFragment && !rendered.includes("专题项目库上下文（ProjectLibraryContext）")) {
          rendered += "\n\n" + String(projectFragment)
            .split(targetToken).join(targetList)
            .split(sourceToken).join(sourceLabel)
            .split(reactionToken).join(targetReaction);
        }
        return actionConfig.scopeNote + "\n\n" + rendered;
      } catch (error) {
        console.warn("canonical IDE prompt unavailable", error);
        return [
          "统一 IDE 审核提示词当前不可用。",
          "请先使用当前会话已暴露的 literature-ai MCP 工具；若工具未注入，只能把服务端已配置的 MCP API key 传给 app.mcp.context.mcp_auth_context，再受控调用 app.mcp.server 已公开工具；禁止构造 MCPAuthInfo 或自填 source_identity。",
          "禁止直接调用 service/session/model 或数据库。无法取得统一提示词与受控证据入口时，请报告 blocked_by_prompt_contract_unavailable。"
        ].join("\n");
      }
    }

    async function fetchJSON(url, options) {
      const response = await fetch(url, options || {});
      const text = await response.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (_) {
        data = null;
      }
      if (!response.ok) {
        const message = apiErrorMessageFromPayload(data, response.status);
        const error = new Error(message);
        error.status = response.status;
        error.payload = data;
        throw error;
      }
      return data;
    }

    async function handleWebAiFileDrop(event) {
      if (event) event.preventDefault();
      setWebAiFileDropActive(false);
      const files = Array.from(event && event.dataTransfer && event.dataTransfer.files || []);
      if (files.length !== 1) {
        handleWebAiReturnInput();
        renderWebAiValidationFailure([
          { code: "file_read_error", message: "请一次只拖入一个 .json 文件" }
        ], []);
        return;
      }
      const file = files[0];
      const fileName = String(file.name || "");
      if (!fileName.toLowerCase().endsWith(".json")) {
        handleWebAiReturnInput();
        renderWebAiValidationFailure([
          { code: "file_read_error", message: "仅支持 .json 文件" }
        ], []);
        return;
      }
      if (Number(file.size || 0) > WEB_AI_RETURN_MAX_FILE_BYTES) {
        handleWebAiReturnInput();
        renderWebAiValidationFailure([
          { code: "file_read_error", message: "JSON 文件不能超过 5 MB" }
        ], []);
        return;
      }
      try {
        const rawText = await file.text();
        if (!String(rawText || "").trim()) throw new Error("文件内容为空");
        const textarea = document.getElementById("webAiReturnJson");
        textarea.value = rawText;
        handleWebAiReturnInput();
        setWebAiValidationBox(
          "已在当前页面内存中读取文件：" + esc(fileName) + "。请点击“校验结果”。",
          ""
        );
        textarea.focus();
      } catch (error) {
        handleWebAiReturnInput();
        renderWebAiValidationFailure([
          { code: "file_read_error", message: error.message || "无法读取文件" }
        ], []);
      }
    }

          : ""),

    function extractFirstJsonPayload(text) {
      const source = String(text || "");
      const starts = [];
      for (let index = 0; index < source.length; index += 1) {
        const char = source[index];
        if (char === "{" || char === "[") starts.push(index);
      }
      for (let s = 0; s < starts.length; s += 1) {
        const start = starts[s];
        const opener = source[start];
        const stack = [opener === "{" ? "}" : "]"];
        let inString = false;
        let escaping = false;
        for (let index = start + 1; index < source.length; index += 1) {
          const char = source[index];
          if (inString) {
            if (escaping) {
              escaping = false;
            } else if (char === "\\") {
              escaping = true;
            } else if (char === "\"") {
              inString = false;
            }
            continue;
          }
          if (char === "\"") {
            inString = true;
            continue;
          }
          if (char === "{" || char === "[") {
            stack.push(char === "{" ? "}" : "]");
          } else if (char === "}" || char === "]") {
            if (!stack.length || char !== stack[stack.length - 1]) break;
            stack.pop();
            if (!stack.length) return source.slice(start, index + 1).trim();
          }
        }
      }
      return "";
    }

    function parseWebAiJsonText(rawText) {
      const text = String(rawText || "").replace(/^\uFEFF/, "").trim();
      const candidates = [text];
      const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fenced && fenced[1]) candidates.push(fenced[1].trim());
      const extracted = extractFirstJsonPayload(text);
      if (extracted) candidates.push(extracted);
      let lastError = null;
      for (let index = 0; index < candidates.length; index += 1) {
        const candidate = candidates[index];
        if (!candidate) continue;
        try {
          const parsed = JSON.parse(candidate);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            throw new Error("返回内容必须是 JSON 对象，不能是数组或空值。");
          }
          return parsed;
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("无法解析为 JSON。");
    }

        : "";
      return '<div style="margin-top:10px;"><strong>执行计划：</strong><ul>' + rows + "</ul>" + extra + "</div>";
    }

    async function validateWebAiReturnJson() {
      const target = selectedWebAiReturnTarget();
      if (!target || String(target.paper_id || "") !== webAiReturnState.paperId) {
        clearWebAiReturnTransientState("当前文献选择已变化，请重新打开回传入口。");
        renderWebAiValidationFailure([{ code: "paper_id_mismatch", message: "当前选择与弹窗目标不一致" }], []);
        return;
      }
      const textarea = document.getElementById("webAiReturnJson");
      const rawText = String(textarea && textarea.value || "").trim();
      if (!rawText) {
        renderWebAiValidationFailure([{ code: "invalid_json", message: "请先粘贴网页 AI 返回 JSON" }], []);
        return;
      }
      let parsed;
      try {
        parsed = parseWebAiJsonText(rawText);
      } catch (error) {
        webAiReturnState.validatedRawText = "";
        webAiReturnState.validationResponse = null;
        document.getElementById("webAiCopyInstructionBtn").disabled = true;
        const applyButton = document.getElementById("webAiApplyEvidenceBtn");
        if (applyButton) applyButton.disabled = true;
        renderWebAiValidationFailure([{ code: "invalid_json", message: error.message }], []);
        return;
      }
      const validateButton = document.getElementById("webAiValidateBtn");
      validateButton.disabled = true;
      validateButton.textContent = "校验中...";
      document.getElementById("webAiCopyInstructionBtn").disabled = true;
      const applyButton = document.getElementById("webAiApplyEvidenceBtn");
      if (applyButton) applyButton.disabled = true;
      try {
        const endpoint = webAiReturnState.mode === "evidence"
          ? "/api/papers/" + encodeURIComponent(target.paper_id) + "/evidence-review-result/validate"
          : "/api/papers/" + encodeURIComponent(target.paper_id) + "/dft-review-result/validate";
        const data = await fetchJSON(
          endpoint,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(parsed)
          }
        );
        const hasExpectedResult = webAiReturnState.mode === "evidence"
          ? Boolean(data && data.valid === true && Array.isArray(data.execution_plan))
          : Boolean(data && data.valid === true && data.import_analysis_request);
        if (!hasExpectedResult) {
          webAiReturnState.validatedRawText = "";
          webAiReturnState.validationResponse = null;
          renderWebAiValidationFailure(data && data.errors || [], data && data.warnings || []);
          return;
        }
        webAiReturnState.validatedRawText = rawText;
        webAiReturnState.validationResponse = data;
        renderWebAiValidationSuccess(data);
      } catch (error) {
        webAiReturnState.validatedRawText = "";
        webAiReturnState.validationResponse = null;
        renderWebAiValidationFailure([
          { code: "validation_request_failed", message: error.message }
        ], []);
      } finally {
        validateButton.disabled = false;
        validateButton.textContent = "校验结果";
      }
    }

    function workflowClass(status, needsHuman) {
      if (["Human_Confirmed", "ML_Ready", "Citation_Ready", "Human_Complete", "DB_Ready"].includes(status)) return "ok";
      if (["Needs_Human_Confirmation", "Gemini_Flagged", "Evidence_Insufficient", "Rejected", "Suspected_Missing", "Unparsed"].includes(status)) return "bad";
      if (["Initial_Parsed", "AI_Rescanned"].includes(status)) return "ok";
      if (needsHuman || ["Codex_Candidate", "Gemini_Verified", "Gemini_Revised"].includes(status)) return "warn";
      return "warn";
    }

    function qualityClass(status) {
      if (status === "A_text_readable") return "ok";
      if (status === "B_text_partial" || status === "C_scan_clear") return "warn";
      if (!status) return "";
      return "bad";

    function rowMatchesGroupFilter(row, status) {

    function renderStatusFilterOptions() {
      const groupSelect = document.getElementById("statusFilter");

      if (!groupSelect || !workflowSelect) return;
      const restored = state.restoredReviewCenterFilters && typeof state.restoredReviewCenterFilters === "object"
        ? state.restoredReviewCenterFilters
        : null;
      const currentGroup = groupSelect.value || (restored && restored.statusFilter) || "";
      const currentWorkflow = workflowSelect.value || (restored && restored.workflowStatusFilter) || "";
      const rows = Array.isArray(state.rows) ? state.rows : [];
      const workflowCounts = {};
      rows.forEach(function (row) {
        const workflow = String(row && row.workflow_status || "").trim();
        if (!workflow) return;
        workflowCounts[workflow] = Number(workflowCounts[workflow] || 0) + 1;
      });
      const presentStatuses = Object.keys(workflowCounts);
      const orderedStatuses = WORKFLOW_STATUS_ORDER.filter(function (status) {
        return Object.prototype.hasOwnProperty.call(workflowCounts, status);
      }).concat(
        presentStatuses.filter(function (status) {

      const groupHtml = ['<option value="">全部流程状态</option>'];

        groupHtml.push('<option value="' + esc(item.value) + '">' + esc(item.label + " (" + count + ")") + '</option>');

      groupSelect.innerHTML = groupHtml.join("");

    function sortedRows(rows) {
      const items = Array.isArray(rows) ? rows.slice() : [];
      if (getQueryPaperId() && state.metadata && state.metadata.focus_main_paper_id) {
        return sortFocusedSupportPairRows(items, { mainPaperId: state.metadata.focus_main_paper_id });
      }
      const sortBy = getValue("sortFilter") || "recent";
      const serialValue = function (row) {
        const match = String(row && row.paper_code || "").trim().toUpperCase().match(/^[A-Z](\d+)$/);
        if (match) return Number(match[1]);
        const serial = Number(row && row.serial_number);
        if (Number.isFinite(serial) && serial > 0) return serial;
        return Number.MAX_SAFE_INTEGER;
      };
      if (sortBy === "paper_code_asc") {
        return items.sort(function (left, right) {
          const serialDiff = serialValue(left) - serialValue(right);
          if (serialDiff) return serialDiff;
          const codeDiff = String(left.paper_code || "").localeCompare(String(right.paper_code || ""));
          if (codeDiff) return codeDiff;
          return String(left.paper_id || "").localeCompare(String(right.paper_id || ""));
        });
      }
      if (sortBy === "year_desc") {
        return items.sort(function (left, right) {
          const leftYear = Number(left.year || 0);
          const rightYear = Number(right.year || 0);
          if (rightYear !== leftYear) return rightYear - leftYear;
          return String(right.paper_id || "").localeCompare(String(left.paper_id || ""));
        });
      }
      if (sortBy === "conflicts_desc") {
        return items.sort(function (left, right) {
          const keys = [
            "dft_review_conflict_count",
            "locator_issue_count",
            "figure_issue_count"
          ];
          for (const key of keys) {
            const diff = toCount(right[key]) - toCount(left[key]);
            if (diff) return diff;
          }
          return String(right.paper_id || "").localeCompare(String(left.paper_id || ""));
        });
      }
      if (sortBy === "suspected_missing_desc") {
        return items.sort(function (left, right) {
          const missingDiff = toCount(right.suspected_missing_dft_count) - toCount(left.suspected_missing_dft_count);
          if (missingDiff) return missingDiff;
          const rank = function (row) {
            if (row.workflow_status === "Suspected_Missing") return 0;
            if (row.workflow_status === "Unparsed") return 1;
            return 2;
          };
          const rankDiff = rank(left) - rank(right);
          if (rankDiff) return rankDiff;
          return String(right.paper_id || "").localeCompare(String(left.paper_id || ""));
        });
      }
      return items.sort(function (left, right) {
        const createdDiff = String(right.created_at || "").localeCompare(String(left.created_at || ""));
        if (createdDiff) return createdDiff;
        return String(right.paper_id || "").localeCompare(String(left.paper_id || ""));
      });
    }
