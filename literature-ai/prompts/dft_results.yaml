name: dft_results_extraction
version: 0.4
stage: mvp

description: >
  Rule-based DFT results extraction for Li-S battery catalyst papers.
  No LLM dependency — uses regex patterns + keyword matching + heuristics.
  Before trusting any candidate family, confirm the paper type inferred from the original PDF matches the system-parsed paper type; if they disagree, update the parsed type immediately and then continue extraction.

candidate_policy:
  status: system_candidate
  rule: >
    Rule-based extraction is only a preprocessing hint. These records must not
    enter the final DFT database, ML dataset, exports, or trusted matrix until
    AI protocol extraction/review, deduplication, completeness audit, and human
    or second-AI confirmation are complete.

input:
  type: UnifiedPaperDocument
  fields:
    - abstract: str
    - sections: list[UnifiedSection]
    - tables: list[UnifiedTable]
    - figures: list[UnifiedFigure]

output:
  type: list[DFTResultItem]
  item_schema:
    category: str
    adsorbate: str | null
    value: float | null
    unit: str | null
    raw_unit_policy: >
      Rule-based candidates may preserve the raw paper unit. Final AI-adopted
      DFT rows must normalize energy to eV (meV / 1000) and permeance to GPU
      (10^3 GPU * 1000) while preserving the raw expression in evidence text.
    evidence_text: str
    source_location:
      section: str | null
      page: int | null
      figure: str | null
      table: str | null
    confidence: float

locator_policy:
  rule: >
    The extractor should preserve a page only when it is present in the input
    section, table, figure, or page-derived artifact. It must not infer or guess
    a PDF page from section title similarity alone.
  missing_page_behavior: >
    If evidence text is available but no page is present in the source artifact,
    keep source_location.page as null. Downstream review should treat the row as
    text_only evidence, not as an exact PDF locator.
  forbidden:
    - Do not fabricate page numbers.
    - Do not mark text_only rows as exact_page.
    - Do not unlock ML/CSV export from page-less evidence.

categories:
  - adsorption_energy
  - gibbs_free_energy_change
  - reaction_barrier
  - sulfur_desorption_barrier
  - sulfur_desorption_criterion
  - li2s_decomposition_barrier
  - li2s_nucleation_barrier
  - bader_charge
  - charge_transfer
  - d_band_center
  - dos_claim
  - charge_density_difference_claim

adsorbate_mapping:
  s8: S8
  # sulfur / S atom 一律是原子硫 S_atom；只有显式 S8 / cyclo-S8 / 分子硫才是 S8。
  # 绝不能把 "single sulfur atom" 归一化成 S8。
  sulfur: S_atom
  sulphur: S_atom
  s atom: S_atom
  single sulfur atom: S_atom
  atomic sulfur: S_atom
  li2s8: Li2S8
  li2s6: Li2S6
  li2s4: Li2S4
  li2s2: Li2S2
  li2s: Li2S
  polysulfide: LiPS(generic)
  lips: LiPS(generic)

semantic_binding_rules:
  numeric_token_boundary: >
    A numeric capture must be a complete number token. Never emit the trailing
    digits of a longer decimal as a separate candidate: "2.13 eV" must not also
    yield 3 eV and "4.99 eV" must not also yield 9 eV. Reject a capture whose
    first character follows a digit or a decimal point, or that follows a
    scientific-notation exponent marker.
  sulfur_desorption_barrier: >
    A barrier for the desorption of a single sulfur atom from the catalyst
    surface (catalyst regeneration / sulfur-poisoning descriptor) is
    `sulfur_desorption_barrier`, not a generic reaction_barrier.
  sulfur_desorption_criterion: >
    A threshold/criterion form such as "E_b values of less than X eV for the
    binding of a single S atom" is a poisoning/desorption criterion
    (`sulfur_desorption_criterion`), never a measured adsorption_energy.

strategy:
  - keyword_pre_screening: false
  - regex_extraction: true
  - table_scanning: true
  - figure_caption_scanning: true
  - deduplication: true
