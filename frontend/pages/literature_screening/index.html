<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献筛选 - Literature AI</title>
    <link rel="stylesheet" href="../../shared/fonts.css">
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/components.css">
    <link rel="stylesheet" href="../../shared/topnav.css">
    <link rel="stylesheet" href="../../shared/responsive.css">
    <link rel="stylesheet" href="./page.css?v=20261011-unified">
    <script src="../../shared/topnav.js?v=20261003-original-design"></script>
    <script>ThemeManager.init();</script>
</head>
<body>
    <div id="topnav-mount"></div>
    <main class="shell">
        <header class="page-header"><div><h1>文献筛选</h1><p>按发表信息、资料完整度和引用优先级，找到需要的论文。</p></div><button class="btn ghost" onclick="openImportPanel()">导入影响因子</button></header>
        <section class="filter-card">
            <details id="filtersPanel" class="filters-panel" open>
                <summary class="filters-summary"><span>筛选条件</span><span class="filters-summary-hint">年份、期刊、资料与引用</span></summary>
                <div class="filters-grid">
                    <label>年份下限<input id="filterYearMin" type="number" placeholder="不限"></label>
                    <label>年份上限<input id="filterYearMax" type="number" placeholder="不限"></label>
                    <label>包含期刊<input id="filterJournalInc" type="text" placeholder="期刊名称"></label>
                    <label>排除期刊<input id="filterJournalExc" type="text" placeholder="期刊名称"></label>
                    <label>影响因子下限<input id="filterIFMin" type="number" step="0.1" placeholder="不限"></label>
                    <label>影响因子上限<input id="filterIFMax" type="number" step="0.1" placeholder="不限"></label>
                </div>
                <div class="filters-checks">
                    <label><input type="checkbox" id="filterNeedsMetadata"> 待补发表信息</label>
                    <label><input type="checkbox" id="filterHasPdf"> 有正文 PDF</label>
                    <label><input type="checkbox" id="filterHasParsedText"> 有全文文本</label>
                    <label><input type="checkbox" id="filterHasExtractionOutput"> 有提取结果</label>
                    <label><input type="checkbox" id="filterHasVerifiedEvidence"> 有核验证据</label>
                    <label><input type="checkbox" id="filterHasSafeVerifiedEvidence"> 有安全核验证据</label>
                </div>
                <div class="filters-footer"><div class="citation-filters">
                    <label>引用范围<select id="filterExcludeFromCitation"><option value="">全部文献</option><option value="true">不引用</option><option value="false">未排除</option></select></label>
                    <label>引用优先级<select id="filterCitationPriority"><option value="">全部优先级</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option><option value="exclude">排除</option></select></label>
                </div><div class="filter-buttons"><button class="btn ghost" onclick="clearFilters()">重置</button><button class="btn primary" onclick="applyFilters()">应用筛选</button></div></div>
            </details>
        </section>
        <section class="results-card">
            <div class="results-header"><div><h2>筛选结果 <span id="resultCount" class="result-count" aria-live="polite"></span></h2><p>点击标题查看论文，展开资料详情可核对来源和状态。</p></div><button class="btn ghost" onclick="applyFilters()">刷新</button></div>
            <div class="actions-row"><span id="selectionCount">已选 0 篇</span><label>引用优先级<select id="bulkPrioritySelect"><option value="high">高</option><option value="medium">中</option><option value="low">低</option><option value="exclude">排除</option></select></label><button id="bulkPriorityBtn" class="btn ghost" onclick="setPriorityForSelected()" disabled>设置优先级</button><button id="bulkExcludeBtn" class="btn danger" onclick="markSelectedDoNotCite()" disabled>设为不引用</button></div>
            <div class="table-container litai-scroll-x"><table class="screening-table litai-stack"><colgroup><col class="select-width"><col class="title-width"><col class="publication-width"><col class="impact-width"><col class="materials-width"><col class="citation-width"></colgroup><thead><tr><th><input type="checkbox" id="selectAllCheckbox" aria-label="选择全部结果" onchange="toggleSelectAll()"></th><th>文献</th><th>发表信息</th><th>影响因子</th><th>资料与证据</th><th>引用设置</th></tr></thead><tbody id="resultsTableBody"></tbody></table></div>
        </section>
    </main>

    <!-- Import Panel Overlay -->
    <div id="importPanelOverlay" class="modal-overlay" style="display:none;">
        <div class="modal" style="width: 600px;">
            <h3>导入影响因子信息</h3>
            <p class="subtle">粘贴 CSV 或 JSON，以预览方式核对影响因子更新。</p>
            <textarea id="importTextarea" rows="10" placeholder="粘贴 CSV / JSON…" style="width: 100%; margin-bottom: 12px; font-family: monospace;"></textarea>
            <label style="display: block; margin-bottom: 12px;">
                <input type="checkbox" id="importDryRun" checked> 仅预览，不保存
            </label>
            <div id="importResults" style="display: none; background: var(--color-surface-alt); padding: 12px; border-radius: 4px; margin-bottom: 12px;">
                <h4>导入结果</h4>
                <div>导入条目： <span id="importResImported"></span></div>
                <div>更新条目： <span id="importResUpdated"></span></div>
                <div>匹配文献： <span id="importResMatched"></span></div>
                <div>未匹配条目： <span id="importResUnmatched"></span></div>
                <div>无效条目： <span id="importResInvalid"></span></div>
                <div>仍待补信息： <span id="importResNeedsMetadata"></span></div>
            </div>
            <div class="modal-actions">
                <button class="btn ghost" onclick="closeImportPanel()">取消</button>
                <button class="btn primary" onclick="executeImport()">执行导入</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal Overlay -->
    <div id="confirmModalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3 id="confirmModalTitle">确认操作</h3>
            <p id="confirmModalMessage" class="subtle" style="margin-top: 8px; margin-bottom: 16px;"></p>
            <div class="modal-actions">
                <button class="btn ghost" onclick="closeConfirmModal()">取消</button>
                <button id="confirmModalActionBtn" class="btn primary" onclick="executeConfirmedAction()">确认</button>
            </div>
        </div>
    </div>

    <script src="../../shared/view-state.js"></script>
    <script src="./page.js?v=20261011-unified"></script>
</body>
</html>
