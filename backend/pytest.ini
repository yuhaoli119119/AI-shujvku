[pytest]
testpaths = tests
python_files = test_*.py
asyncio_default_fixture_loop_scope = function
markers =
    no_test_database: skip the autouse PostgreSQL fixture for pure unit tests
    unit: pure unit test that does not require PostgreSQL or external services
    integration: integration test across service or API boundaries
    postgres: test that uses an isolated PostgreSQL schema
    slow: intentionally long-running acceptance or end-to-end test
